name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python tests/smoke.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t netops-field-notes-mcp:ci .
      # The server must start in the container and answer an initialize request.
      - name: Introspection check
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 30 docker run -i --rm netops-field-notes-mcp:ci | tee /tmp/out.json
          grep -q '"serverInfo"' /tmp/out.json
